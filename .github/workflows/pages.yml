name: pages
# The web page (web/): the emulator and the C player in one pinned WebAssembly, published to GitHub Pages. Elite itself is
# not part of it: the page loads Mark Moxon's flicker-free disc from his GitHub repository in the visitor's browser.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build the site (the pinned core.wasm, its hash checked; the page)
        run: web/build_site.sh
      - name: the dev page, at /dev/, from the wsp-modes branch (wsp/MODES.md there; the main page publishes without it if this fails)
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin wsp-modes
          git worktree add -q /tmp/dev FETCH_HEAD
          ln -s "$PWD/web/node_modules" /tmp/dev/web/node_modules
          (cd /tmp/dev/web && ./build_site.sh)
          cp -r /tmp/dev/web/_site "$PWD/web/_site/dev"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
