name: release
# A tag v* makes a GitHub release with elite-agent.bin, the plugin for rp2350-bbc-micro's plugin slot
# (curious mode, autostart), and its SHA-256.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  plugin:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/arm-deps
      - run: ELITE_VERSION=${{ github.ref_name }} presto/app/build.sh
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd presto/app/build && sha256sum elite-agent.bin > elite-agent.bin.sha256
          gh release create ${{ github.ref_name }} elite-agent.bin elite-agent.bin.sha256 --title "elite-agent ${{ github.ref_name }}" \
            --notes "The elite-agent plugin for [rp2350-bbc-micro](https://github.com/8bitkick/rp2350-bbc-micro)'s plugin slot (BBC Master 128, curious mode, starts by itself). Install it from the web panel's Plugin section, or \`tools/presto.py app install elite-agent.bin\`. SHA-256: $(cut -d' ' -f1 elite-agent.bin.sha256)"
