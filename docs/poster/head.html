<title>Commander CLAUDE: Elite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a tall poster of stacked bands on deep space; each band is one panel of the career,
   instrument-style labels in mono, the BBC Micro's own cyan / yellow / red as the accent inks. */
:root {
  color-scheme: dark;
  --space: #06070c;
  --panel: #0c0f17;
  --rule: #1c2232;
  --ink: #e7ebf3;
  --muted: #8b94a8;
  --faint: #3a4256;
  --cyan: #38d8f2;
  --yellow: #f4c84a;
  --red: #ff5f5a;
  --s1: #3987e5;  /* chart series (validated on --panel) */
  --s2: #d95926;
  --s3: #199e70;
  --display: "Michroma", "Eurostile", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
html { background: var(--space); }
body { background: var(--space); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 28px; }
h1, h2 { font-family: var(--display); font-weight: 400; letter-spacing: .06em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 64px); line-height: 1.05; }
h2 { font-size: clamp(17px, 2.2vw, 22px); color: var(--ink); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
p { margin: 0; max-width: 68ch; color: #c9cfdc; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 22px; display: grid; gap: 16px; min-width: 0; }
.panel header { display: grid; gap: 6px; }
.note { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 28px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 32px; align-items: center; }
.hero .title { display: grid; gap: 18px; min-width: 0; }
.hero h1 span { color: var(--yellow); }
.hero figure { margin: 0; }
.screen { image-rendering: pixelated; display: block; width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 4px; background: #000; }
.hero figcaption, figure figcaption { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 8px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.stat { background: var(--panel); padding: 16px 18px; display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 2.6vw, 30px); color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.chart .axis { stroke: var(--faint); stroke-width: 1; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .band { fill: #10141f; }
.chart .label-ink { fill: var(--ink); }
.scroll { overflow-x: auto; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: #05070cee; border: 1px solid var(--faint); border-radius: 4px; padding: 7px 10px; font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.map h3 { font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin: 0 0 6px; }

.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.shots figure { margin: 0; }
.fightgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
@media (max-width: 860px) { .fightgrid { grid-template-columns: 1fr; } }
canvas#space { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; display: block; background: #03040a; border: 1px solid var(--rule); border-radius: 4px; cursor: grab; touch-action: none; }
.scrub { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.scrub input { flex: 1; accent-color: var(--yellow); }
button { font-family: var(--mono); font-size: 12px; color: var(--ink); background: transparent; border: 1px solid var(--faint); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.diagram svg { min-width: 760px; }
.diagram text { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.diagram .sub { fill: var(--muted); font-size: 10.5px; }
.diagram .box { fill: #121726; stroke: var(--faint); stroke-width: 1; }
.diagram .key { stroke: var(--cyan); }
.diagram .zone { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 4 4; }
.diagram .zl { fill: var(--cyan); font-size: 11px; letter-spacing: .12em; }
.diagram .wire { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.diagram .wire.k { stroke: var(--yellow); }
.diagram .wire.t { stroke: var(--faint); stroke-dasharray: 3 4; }
table { border-collapse: collapse; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 480px; width: 100%; }
th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { white-space: normal; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 400; }
tr.won td { color: var(--yellow); }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
footer a { color: var(--cyan); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
